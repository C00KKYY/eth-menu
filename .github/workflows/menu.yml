name: ETH Menue holen
on:
  schedule:
    # GitHub laesst geplante Laeufe regelmaessig ausfallen (v. a. zur vollen Stunde).
    # Darum mehrere Versuche zu krummen Minuten, alle vor dem 11:15-Lauf (CET = UTC+1).
    - cron: "17 5,6,7,8,9 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_menu.py
      - run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Menue aktualisiert"
          git pull --rebase
          git push
