name: ETH Menue holen
on:
  schedule:
    - cron: "30 8 * * 1-5"   # ca. 09:30 Schweizer Zeit (Winter), vor dem 11:15-Lauf
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_menu.py
      - run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Menue aktualisiert"
          git push
