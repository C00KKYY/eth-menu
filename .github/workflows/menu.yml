name: ETH Menue holen
on:
  schedule:
    # GitHub startet geplante Laeufe oft stundenlang verspaetet oder gar nicht.
    # Unkritisch: jeder Lauf schreibt die Tagesdateien fuer die naechsten 14 Tage.
    - cron: "17 5,11,17 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_menu.py
      - run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Menue aktualisiert"
          git pull --rebase
          git push
